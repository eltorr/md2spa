# nginx config for a site built by md2spa.
#
# Two things actually matter here and everything else is tuning:
#
#   1. `try_files ... /404.html` so an unknown path serves the generated 404 page with a
#      real 404 status, instead of nginx's stock error page.
#   2. Hashed assets are immutable, HTML and JSON payloads are not. Getting this backwards
#      is what makes a deploy look like it did not take effect.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # md2spa emits clean URLs: /guide/install/ is a directory holding index.html.
    # nginx resolves that from `index` above, so no rewrite rules are needed.
    charset utf-8;

    # Do not advertise the exact nginx version in Server: or on error pages.
    server_tokens off;

    # --- compression -------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Never gzip images that are already compressed; it burns CPU for nothing.

    # --- security headers ---------------------------------------------------------------
    # md2spa emits no inline event handlers and calls neither eval nor new Function, so a
    # strict CSP is achievable. `unsafe-inline` is needed for style-src only because the
    # theme sets a couple of custom properties inline, and for script-src because the
    # no-flash-of-wrong-theme bootstrap must run before the stylesheet paints.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "DENY" always;

    # --- caching ------------------------------------------------------------------------
    # Hashed filenames (style.1a2b3c4d.css) change whenever their content changes, so they
    # can be cached forever.
    location ~* "\.[0-9a-f]{8}\.(css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Images and fonts in static/ are not content-hashed, so they get a modest TTL and
    # must revalidate rather than being pinned for a year.
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        access_log off;
        try_files $uri =404;
    }

    # HTML, SPA payloads and the search index are the things that change on every deploy.
    # `must-revalidate` keeps a stale page from surviving a publish.
    location ~* \.(html|json|xml|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # --- routing ------------------------------------------------------------------------
    location / {
        # $uri       an exact file
        # $uri/      a directory, resolved to index.html by `index`
        # /404.html  the generated not-found page, served with a 404 status below
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Nothing in a built site should be reachable as a dotfile.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
