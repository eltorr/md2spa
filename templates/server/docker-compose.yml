# md2spa -> a self-hosted static site
#
#   docker compose up --build -d      start on http://localhost:8080
#   docker compose logs -f            follow the access log
#   docker compose up --build -d      redeploy after editing content/
#
# The site is baked into the image at build time, so a redeploy is a rebuild. That is the
# point: the running container has no source, no toolchain and nothing writable.

services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-docs:latest
    container_name: my-docs
    ports:
      # host:container -- change 8080 to 80 to serve directly on the host.
      - "8080:80"
    restart: unless-stopped
    read_only: true
    # nginx needs somewhere to write its pid and proxy temp files; tmpfs keeps the rest of
    # the filesystem read-only, so a compromised worker has nothing to persist to.
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
