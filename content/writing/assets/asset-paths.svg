<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200"
     role="img" aria-labelledby="ttl desc">
  <title id="ttl">Where an asset is written and where it is served</title>
  <desc id="desc">Two rows. A file at content slash writing slash assets slash flow.png is served
    at slash writing slash assets slash flow.png. A file at static slash logo.svg is served at
    slash logo.svg.</desc>

  <!--
    An SVG loaded through an img element cannot inherit the page's custom properties, but
    it does honour its own prefers-color-scheme query, so the palette is declared here and
    the diagram stays legible in both themes.
  -->
  <style>
    .box   { fill: none; stroke: #94a3b8; stroke-width: 1.25; }
    .label { fill: #64748b; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
    .path  { fill: #334155; font-size: 13px; }
    .note  { fill: #64748b; font-size: 11px; font-style: italic; }
    .arrow { stroke: #94a3b8; stroke-width: 1.25; fill: none; }
    .head  { fill: #94a3b8; }
    text   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    @media (prefers-color-scheme: dark) {
      .box   { stroke: #64748b; }
      .label { fill: #94a3b8; }
      .path  { fill: #e2e8f0; }
      .note  { fill: #94a3b8; }
      .arrow { stroke: #64748b; }
      .head  { fill: #64748b; }
    }
  </style>

  <text class="label" x="1" y="18">SOURCE</text>
  <text class="label" x="369" y="18">SERVED AT</text>

  <rect class="box" x="0.5" y="32.5" width="268" height="50" rx="7"/>
  <rect class="box" x="369.5" y="32.5" width="270" height="50" rx="7"/>
  <rect class="box" x="0.5" y="118.5" width="268" height="50" rx="7"/>
  <rect class="box" x="369.5" y="118.5" width="270" height="50" rx="7"/>

  <text class="path" x="16" y="52">content/writing/</text>
  <text class="path" x="16" y="70">  assets/flow.png</text>
  <text class="path" x="385" y="63">/writing/assets/flow.png</text>

  <text class="path" x="16" y="149">static/logo.svg</text>
  <text class="path" x="385" y="149">/logo.svg</text>

  <text class="note" x="292" y="50">copied</text>
  <text class="note" x="292" y="136">copied</text>

  <path class="arrow" d="M285 58 h70" marker-end="url(#arrow)"/>
  <path class="arrow" d="M285 144 h70" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
</svg>
